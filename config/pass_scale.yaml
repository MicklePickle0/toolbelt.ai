# Serve-receive pass quality (0-4), first ball after the serve only.
#
# DRAFT thresholds. The 2/3/4 boundaries are an interpretation of the owner's
# wording and MUST be tuned/confirmed against hand-labeled passes.
#
# Coordinates use the court frame in court.yaml (x lateral 0-9, y depth from
# the net). Distances are measured from the pass's best set point (the ball's
# position at the setter contact, or the apex/drop point if the setter never
# touches it) to the setter target.

target:
  x: 5.5   # slightly right of centre (between zones 3 and 2)
  y: 1.0   # about a metre off the net

# Evaluated top-down; first matching grade wins. A grade matches when the
# pass is within BOTH limits. null = no limit on that axis.
grades:
  - score: 4
    label: perfect
    max_depth_error: 1.0
    max_lateral_error: 1.5
    min_apex_height: null   # "high"; set once measured on labeled data
  - score: 3
    label: decent
    max_depth_error: 2.0    # ~1 m off the attack line, net side (to confirm)
    max_lateral_error: 2.5
    min_apex_height: null
  - score: 2
    label: mediocre
    max_depth_error: 3.5    # around / slightly behind the attack line
    max_lateral_error: 3.5
    min_apex_height: null
  - score: 1
    label: terrible
    max_depth_error: null
    max_lateral_error: null
    min_apex_height: null

# Score 0 (ace) is not geometric: it comes from the point-outcome logic.
ace_score: 0

# Our first touch after their serve going straight back over the net (labelled
# `overpass`) is still a serve receive: it scores this and counts in the passer's
# average (owner's rule, 2026-10-24).
overpass_score: 0

# Below this confidence the pass score goes to the review queue.
review_below_confidence: 0.6

# Pass scores in processing (stats/pass_score.py, score_passes): how sure each is, times
# how sure the receive's action and the next touch are. Below review_below_confidence the
# review page shows the score as the pipeline's guess.
pipeline:
  located_3d_confidence: 0.8     # the next player found under the ball's 3D position
  located_image_confidence: 0.6  # ...found in the image (hands at the ball)
  overpass_confidence: 0.8       # their side played it next
  shank_confidence: 0.6          # no next touch and they won the point
  inferred_next_factor: 0.5      # the next touch wasn't seen (added from the timing)
