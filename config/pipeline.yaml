# Pipeline-wide settings. Paths are relative to the repo root.

paths:
  data_dir: data
  cache_dir: data/cache
  output_dir: data/outputs
  # One JSON per video (camera pose, clicks, confidence). Not a cache: manual
  # clicks are human work.
  calibration_dir: data/calibration
  db_path: data/setter_eyes.db
  # Ground truth from hand-labelled footage. Same schema as db_path but a
  # separate file, so pipeline output can be evaluated against it.
  labels_db_path: data/labels.db
  # Registry of videos + their label files (see config/manifest.example.yaml).
  manifest_path: data/manifest.yaml

ingest:
  # Frames are cached as JPEG. The ball is small: keep quality high.
  jpeg_quality: 95
  # Decode on the GPU (D3D11 on Windows) when available. Checked on our AV1/VP9
  # files: same frames at the same indices as CPU decoding, ~20x faster.
  hw_decode: true

datasets:
  # Never split by frame. "venue" keeps every video from one venue in the same
  # split, so valid/test measure generalisation to unseen gyms. "video" splits
  # by video only: use it while you have too few venues (fewer than ~3) to
  # fill every split. Switching later reshuffles splits, so retrain after.
  split_by: video             # venue | video  (video: only one venue so far, Humber)
  # Unpinned venues (or videos) are assigned by a stable hash of their name
  # with these ratios.
  split_ratios:
    train: 0.7
    valid: 0.15
    test: 0.15
  detection_classes: [ball, person]
  detection_export_dir: data/datasets/detection

models:
  # Weights live in models/ (gitignored). Fill in once trained/downloaded.
  person_detector: null       # RF-DETR checkpoint, class: person
  ball_detector: null         # RF-DETR fine-tuned on our footage, class: ball
  pose: null                  # RTMPose ONNX via rtmlib

detect:
  person_min_confidence: 0.4
  ball_min_confidence: 0.25
  ball_input_resolution: 1280

track:
  tracker: bytetrack          # bytetrack | botsort
  camera_motion_compensation: true

ball:
  gravity: 9.81
  # Kalman process / measurement noise, image px. Tune on real footage.
  process_noise: 1.0
  measurement_noise: 4.0

identity:
  number_vote_bind_threshold: 0.8
  min_crop_height_px: 80

contacts:
  max_contacts_per_side: 3   # plus a block

# Global review policy: any automated output whose confidence is below its
# stage threshold is queued for review.
review:
  default_min_confidence: 0.6

train:
  # RF-DETR fine-tune (scripts/train_detector.py), on the local GPU (RTX 4070 SUPER,
  # 12 GB) or a rented one. Never on a CPU.
  model: medium              # nano | small | medium | base | large (Apache-2.0)
  # Must be a multiple of patch_size * num_windows: 32 for nano/small/medium/large,
  # 56 for base (use 1288). The ball is ~20 px at 4K: keep it high.
  resolution: 1280
  epochs: 60
  batch_size: auto           # largest that fits in GPU memory; or an integer
  grad_accum_steps: 4
  lr: 0.0001
  early_stopping: true
  num_workers: 2
  pretrained_dir: models/pretrained
  output_dir: models/rfdetr
  # Pre-labelling (scripts/prelabel.py): keep boxes above this score for correction.
  prelabel_threshold: 0.3
