# Pipeline-wide settings. Paths are relative to the repo root.

paths:
  data_dir: data
  cache_dir: data/cache
  output_dir: data/outputs
  # One JSON per video (camera pose, clicks, confidence). Not a cache: manual
  # clicks are human work.
  calibration_dir: data/calibration
  db_path: data/setter_eyes.db
  # Ground truth from hand-labelled footage. Same schema as db_path but a
  # separate file, so pipeline output can be evaluated against it.
  labels_db_path: data/labels.db
  # Registry of videos + their label files (see config/manifest.example.yaml).
  manifest_path: data/manifest.yaml

video:
  # Footage from 1080p30 up to 4K60. Pixel settings in this file (keys ending in `_px`
  # or containing `_px_`) are written for this frame width and scale with the video's
  # width (config.scale_px), so 1080p uses half of each.
  reference_width: 3840
  # Whole-video detection samples frames at this rate (59.94 fps: every 2nd frame, 30 fps:
  # every frame). Settings counted in samples (tracker misses, arc windows) assume it.
  sample_hz: 30

ingest:
  # Frames are cached as JPEG. The ball is small: keep quality high.
  jpeg_quality: 95
  # Decode on the GPU (D3D11 on Windows) when available. Checked on our AV1/VP9
  # files: same frames at the same indices as CPU decoding, ~20x faster.
  hw_decode: true

datasets:
  # Never split by frame. "venue" keeps every video from one venue in the same
  # split, so valid/test measure generalisation to unseen gyms. "video" splits
  # by video only: use it while you have too few venues (fewer than ~3) to
  # fill every split. Switching later reshuffles splits, so retrain after.
  split_by: video             # venue | video  (video: only one venue so far, Humber)
  # Unpinned venues (or videos) are assigned by a stable hash of their name
  # with these ratios.
  split_ratios:
    train: 0.7
    valid: 0.15
    test: 0.15
  detection_classes: [ball, person]
  # Cut frames into overlapping native-resolution tiles (training export and
  # pre-labelling), so the ~20-60 px ball isn't shrunk 3x by the model's resize.
  # null = whole frames. Revisit before training `person`: tiles cut tall players.
  tiles: 3x3
  tile_overlap: 0.15
  negative_tiles_per_frame: 1   # box-free tiles kept per frame as background
  # Hue-shifted copies of train-split ball tiles: a cheap stand-in for ball colours
  # we have no footage of yet (Humber is all yellow/blue Mikasa). Shifts in degrees:
  # yellow -> green (+60/+90), -> red/orange (-40), blue panels -> other colours.
  # Real labelled footage of each ball type still matters more. 0 copies = off.
  # Off: with 2 copies the model (run batch12_medium_1280) learned "round thing of any
  # colour" and fired on heads, a basketball hoop and wall marks (127 false boxes on the
  # valid match vs 1). Revisit once real footage of other balls is labelled.
  recolor_copies: 0
  recolor_hues: [-40, 60, 90, 150, -120]
  detection_export_dir: data/datasets/detection

models:
  # Weights live in models/ (gitignored). Fill in once trained/downloaded.
  person_detector: null       # null = COCO-pretrained RF-DETR (class: person); set if fine-tuned
  # RF-DETR Medium, 1280, tiled 3x3; 720 Humber frames (batches 1-3). Held out:
  # test 96% recall / 12 false boxes in 120 frames, valid 90% / 8.
  ball_detector: models/rfdetr/batch123_medium_1280/checkpoint_best_total.pth
  pose: null                  # RTMPose ONNX via rtmlib

detect:
  person_min_confidence: 0.4
  ball_min_confidence: 0.25
  ball_input_resolution: 1280
  # Whole-video ball detection (scripts/detect_ball.py) samples at video.sample_hz.
  # Tiles: datasets.tiles at the video's own resolution, so a tile covers the same share
  # of the frame (and the ball the same share of the model input) at 1080p as at 4K.
  # Stored detections go down to this score; the tracker decides what to trust.
  ball_store_threshold: 0.15
  ball_save_every: 2000      # processed frames between checkpoints (resumable)
  # Only detect during play: skip the time between rallies (data/cache/<id>/play_spans.json
  # from scripts/find_play.py; without it every frame is detected). --all-frames turns it off.
  ball_play_only: true
  # While a moving ball is followed, detect only a tile-sized window around where it
  # should be, not all 9 tiles. If the window misses it, the whole frame is scanned.
  ball_follow:
    enabled: true
    full_scan_every_s: 0.33  # scan the whole frame this often anyway (a new ball, a far serve)
    max_windows: 2           # balls followed at once (the match ball + one more)
    min_score: 0.5           # detections this confident start or continue a followed ball
    min_move_px: 60          # ...followed once it has moved this far (spare balls never do)
    gate_px: 300             # a detection this close to a prediction is that ball
    confirm_hits: 3          # a new ball gets full scans until seen this often
    forget_s: 1.0            # a ball not seen this long is forgotten (longer than the
                             # full-scan interval, so spare balls stay known as static)
    edge_margin_px: 120      # the prediction must sit this far inside the window
  # Whole-video person detection (scripts/detect_people.py): the COCO-pretrained RF-DETR
  # `person` class on whole frames (players are large; tiles would cut them). 1280 finds
  # slightly more small/far people than the native 576 for ~8 ms more per frame.
  person_model: medium
  person_input_resolution: 1280
  person_store_threshold: 0.3

track:
  # People tracking (setter_eyes.track.people, scripts/track_people.py). Boxes are moved
  # into the calibrated reference view first: that is the camera-motion compensation.
  tracker: bytetrack
  bytetrack:
    # The pretrained detector scores players ~0.5, so ByteTrack's defaults (0.6/0.7)
    # would treat most players as low-confidence; these suit our scores.
    high_conf_det_threshold: 0.45
    track_activation_threshold: 0.45
    minimum_consecutive_frames: 3
    minimum_iou_threshold: 0.1
    lost_track_buffer: 60     # samples (2 s at 30 Hz) a lost track may come back within
  feet_edge_px: 15            # box bottom this close to the frame edge = feet cut off
  smooth_samples: 5           # rolling median of court positions per track
  clean:
    # A position this far (m) from the track's own rolling median is a glitch (a box
    # swapped with a neighbour's, a jump across the court): replace it by interpolation.
    outlier_dev_m: 1.5
    outlier_window: 9         # samples (0.3 s) for that rolling median
    # Fill samples where the track was alive but the player hidden, up to this long.
    max_gap_s: 2.0
    # Jumps: apparent height (box height x distance / f) more than this above the
    # track's own median over the window means the feet are off the floor.
    jump_tolerance: 0.05      # low camera: 10 cm off the floor is ~0.75 m of error at the net
    jump_window_samples: 61   # 2 s: longer than any jump, so the median stays grounded
    jump_pad_samples: 3       # widen each detected jump to cover take-off and landing
  link:                       # join broken tracks of one person (step 4b)
    max_gap_s: 1.5
    max_speed_mps: 6.0        # faster than a player moves = a different person
    slack_m: 0.5
    area_margin_m: 1.0        # pieces join only within one area: our half / theirs / off court
  our_half_margin_m: 3.0      # summaries: "in our half" includes this margin off the court
  roles:                      # provisional near-side filter (setter_eyes.track.roles)
    court_margin_m: 1.0       # players chase balls a little off court
    net_overlap_m: 0.5        # either team can be this far past the centre line at the net
    min_share: 0.6            # share of a track's time in a half to belong to that side
    min_duration_s: 2.0       # shorter tracks are fragments: role "other"
    full_confidence_s: 5.0
    min_move_m: 0.75          # players move; spectators/coaches near the court don't (4a)
    now:                      # per-moment test (rings, later the serve rule): roles.ours_now
      inside_margin_m: 0.5    # inside our court incl. this much over the lines: ours
      net_clearance_m: 0.2    # feet must be this far on our side of the centre line
      chase_margin_m: 1.5     # further out only during a rally, for near-player tracks

ball:
  # Ball tracking (setter_eyes.ball, scripts/track_ball.py). Pixels are in the pan-free
  # reference view of the calibrated frame, written for 4K (scaled with the video's width).
  gravity: 9.81
  typical_depth_m: 15        # sets the starting image-space pull of gravity
  gate_px: 150               # a touch can move the ball ~150 px off the prediction
  meas_sigma_px: 3.0
  meas_sigma_rel: 0.1        # ...or this share of the box size, whichever is larger
  birth_score: 0.5           # unmatched detections this confident start a track
  max_misses: 10             # samples (1/3 s at 30 Hz) before a track ends
  tentative_max_misses: 2
  bridge_samples: 3          # fill gaps up to this long (smoothed between neighbours)
  static_spread_px: 60       # a track that never moves further is a spare ball / wall mark
  kalman:
    jerk_px_s3: 20000
    init_sigma_px: {pos: 5.0, vel: 3000.0, acc: 3000.0}
  arcs:
    min_samples: 6           # shortest flight (0.2 s at 30 Hz)
    max_gap_s: 0.15
    window_samples: 5        # touches: one quadratic over +-5 samples vs two separate ones
    break_px: 5.0            # ...splitting cuts the error by more than this (px RMS) = a touch
    pixel_sigma_px: 3.0
    depth_range_m: [3.0, 40.0]
    depth_steps: 10
    refine_starts: 3
    # Physical bounds for the fit (court metres, m/s): stops depth running off to
    # absurd distances where gravity's effect vanishes.
    bounds_xy_m: [-15.0, 30.0]
    max_speed_mps: 45.0
    floor_tolerance_m: 0.3
    max_height_m: 15.0
    max_rms_px: 12.0         # confidence reaches 0 at this pixel RMS
    full_confidence_s: 0.5   # shorter flights fix depth poorly
    depth_spread_scale_m: 2.0
    min_confidence: 0.4      # below this an arc goes to the review queue

identity:
  number_vote_bind_threshold: 0.8
  min_crop_height_px: 80
  rotation:                  # identity/rotation.py
    unknown_serve_factor: 0.5  # rotation confidence factor for a rally with no serving team

contacts:
  # Touches and floor contacts from soft evidence (setter_eyes.contacts.events).
  max_contacts_per_side: 3   # plus a block
  over_limit_penalty: 0.5    # confidence factor for a touch beyond that in a row
  # Stuff blocks (setter_eyes.contacts.blocks, scripts/check_blocks.py): a point-ending
  # attack the attacker lost, re-detected at full frame rate; a second sharp turn right
  # after it = the ball came back off a block. Labelled: 2/2 stuff blocks >= 2169 px/s,
  # 0/19 attack errors (max 1565). Only 2 examples: added blocks go to review.
  stuff_block:
    window_before_s: 0.15    # decoded around the attack
    window_after_s: 0.35
    min_score: 0.3           # a detection this sure, in the crop where the path puts the ball,
    max_jump_px: 250         # this close to it, is the ball
    lag_samples: 3           # turn = velocity change over this many frames each side
    own_turn_s: 0.1          # the attack's own turn is the strongest within this of it
    min_gap_s: 0.03          # a second turn this long after it...
    max_gap_s: 0.25          # ...and no longer (labelled attack -> block: 0.03-0.23 s)
    valley_ratio: 1.5        # a peak of its own: this x the lowest turn in between
    min_turn_px_s: 2000      # strong enough (4K px/s): a block
    confidence: 0.6
  max_join_gap_samples: 2    # flights this close (samples) join at a shared sample
  max_bridge_s: 0.3          # further apart, up to this long (ball hidden by the toucher):
  bridge_penalty: 0.8        #   still a candidate, mid-gap, at this confidence factor
  merge_window_s: 0.12       # candidates closer than this are one event (a split flight)
  snap_window_s: 0.15        # move a candidate to the sharpest change of course within
                             # this (the flight split can be off by a few samples); 0: off
  min_arc_confidence: 0.4    # both flights at least this confident -> use 3D evidence
  velocity_scale_mps: 4.0    # course change -> evidence: 1 - exp(-dv / scale)
  reach_scale_m: 1.0         # person within reach -> evidence: exp(-distance / scale)
  reach_scale_bodies: 0.5    # ...the same in body heights when only the image is known
  overhead_reach_bodies: 0.6 # the reach zone extends this far above the head (sets, attacks)
  max_reach_m: 3.6           # a touch higher than this isn't by a person (blocks reach ~3.4)
  no_person_prior: 0.2       # nobody near: a course change can still be a touch (occlusion)
  floor_height_m: 0.35       # ball this low after falling = floor contact
  metres_per_px_at_typical_depth: 0.005   # rough image -> m/s for weak flights (4K, ~15 m)
  min_confidence: 0.15       # weaker candidates are dropped
  scorer:                    # learned touch scorer, used when its model file exists
    path: models/contacts/touch_scorer.pkl   # scripts/train_touch_scorer.py writes it
    threshold: 0.3             # P(touch) to keep a candidate
    nms_s: 0.35                # one touch per window: the most likely candidate wins
    match_tolerance_s: 0.25    # training target: the candidate this close to a labelled touch
    cv_folds: 5                # validation grouped by rally
    model: {max_iter: 200, learning_rate: 0.05, max_leaf_nodes: 15, min_samples_leaf: 10,
            l2_regularization: 1.0}
    team_model: {max_iter: 150, learning_rate: 0.05, max_leaf_nodes: 7, min_samples_leaf: 8,
                 l2_regularization: 0.0}

serve:
  end_line_y_m: 8.0          # ball at or behind |y| = 8 m (end lines at 9 m)
  height_m: [1.5, 4.0]       # standing, jump-float and jump serves
  min_arc_confidence: 0.4
  # Serves traced back from the rally's first net-crossing flight:
  traced_from_y_m: 9.5       # just behind the end line (at 9 m)
  traced_height_m: [1.0, 4.2]
  min_speed_mps: 8.0         # horizontal speed at the start of that flight
  max_trace_back_s: 1.2

rally:
  max_ball_gap_s: 1.0        # the ball lost longer than this ends an episode
  min_rally_s: 1.5
  serve_window_s: 4.0        # a serve must be this close to the start of an episode
  min_arc_confidence: 0.4    # flights trusted to show the ball crossing the net
  base_confidence: 0.4
  serve_bonus: 0.3
  floor_bonus: 0.3
  # Point winner = the next rally's serving team (setter_eyes.rally.winner; labelled: 79/79).
  # The review key press and scoreboard OCR override it.
  winner:
    suspect_gap_s: 32        # a longer gap to the next rally may hide a missed rally
                             # (labelled gaps: median 16 s, p90 23 s; timeouts ~90 s)
    suspect_factor: 0.6      # winner confidence factor then
  # Rallies built from touches (used with the learned touch scorer):
  from_touches:
    max_touch_gap_s: 3.0     # touches closer than this are one rally (labelled: <= 2.2 s
                             # within a rally, >= 14 s between rallies); tighter keeps
                             # pre-serve ball handling (throwing it to the server) apart
    serve_lookback_s: 2.5    # a serve traced back from flight may start this long before
                             # the first touch seen
    end_window_s: 3.0        # the rally ends this soon after its last touch at the latest
    serve_flight_s: 1.07     # a missed serve is placed this long before the first reply
                             # (labelled serve -> first touch: median 1.07 s, 0.8-1.4)
    base_confidence: 0.3
    serve_bonus: 0.2         # a serve seen as a touch or traced back
    exchange_bonus: 0.3      # the ball changed sides (touches by both teams)
    floor_bonus: 0.2         # ended on a floor contact
    inferred_factor: 0.7     # serve inferred, not seen: right about half the time on
                             # labelled footage, so these go to the review queue
  # Live-ball check (setter_eyes.rally.live): a trailing touch after the whistle (ball
  # caught or tossed back, e.g. after a net touch) ends the rally before it when BOTH:
  live_ball:
    max_gap_s: 2.0           # it comes this long after the previous touch, and
    window_s: 1.0            # near-side players' speed over this window before it is
    motion_ratio: 0.9        # below this share of their speed over the rally so far.
                             # Labelled: 5/13 dead touches caught, 0/76 real last cut.
    trimmed_factor: 0.9      # rally confidence factor when trimmed (worth a look)
  # Our serve from how the ball enters the frame (setter_eyes.rally.serve_entry): big,
  # at the top, after dead time, then far away. Labelled: 28/33 of our serves, 4 false.
  our_serve:
    min_size: 0.037          # ball box >= this share of the image height (80 px in 4K)
    top_share: 0.35          # first seen in the top 35% of the frame
    quiet_s: 3.0             # no touch for this long before it (play was dead)
    touch_slack_s: 0.3       # touches this close before it are the serve itself
    away_size: 0.021         # smaller than this share of the height (45 px in 4K)...
    away_within_s: 2.0       # ...within this long: it was hit away, not caught
    merge_s: 1.0             # big sightings this close together are one appearance
    match_touch_s: 0.5       # a pipeline touch this close is the serve touch
    toss_max_s: 1.2          # follow a rising toss this long to find the hit
    rise_slack: 0.001        # still rising: up the frame by more than this share (2 px)
    confidence: 0.8
    min_flight_s: 0.6        # a serve-only rally from it (no other touch, no floor, no net
                             # crossing) needs the ball followed this long after the serve.
                             # Labelled: real aces/service errors 1.3-3.4 s; the 2 false
                             # ones 0.30-0.33 s (the ball lost at once: no serve flight)
  # Our court's airspace (court metres): touches with the ball outside it are another
  # court's (balls on the courts beside ours). Court: x 0-9, y -9..9, net at y = 0.
  airspace:
    x_m: [-3.0, 12.0]
    y_m: [-12.0, 12.0]
    max_z_m: 10.0

classify:
  # Stage-1 action rules (setter_eyes.classify.rules): touch order within each side's run.
  block_zone_m: 1.0          # a block: ball this close to the net plane...
  block_min_z_m: 2.0         # ...and at least this high (tape at 2.24-2.43 m)
  # Stage 2: an "attack" whose ball is launched upward faster than this is a free ball
  # (lofted, not driven). Labelled: 5/6 free balls above 4 m/s, 0/30 attacks.
  free_ball_min_up_mps: 4.0
  launch_window_s: 0.4       # the flight leaving a touch starts within this
  launch_min_arc_confidence: 0.4
  rule_confidence:           # per rule; times the touch's own confidence
    serve: 0.95
    receive: 0.9
    set: 0.85
    attack: 0.8
    dig: 0.75
    block: 0.6
    coverage: 0.6
    dump: 0.6
    overpass: 0.6
    free_ball: 0.6
    uncertain: 0.4           # a 4th touch in a row, or a reply on the serving side

overlay:                     # drawing sizes in render_overlay.py demos
  ring_radius_m: 0.55        # green ring under each of our players, court metres
  trail_px: 3                # ball trail width at 1920 px wide (scaled with the video)
  spotlight:                 # one player's ring in their highlight clips (clips.py --player)
    ring_radius_m: 0.55      # outer edge, court metres
    ring_width_m: 0.12       # band width: a ring around the feet, not a filled disc
    ring_opacity: 0.85
    ring_colour: [60, 220, 60]   # BGR

# Global review policy: any automated output whose confidence is below its
# stage threshold is queued for review.
review:
  default_min_confidence: 0.6

evaluate:
  # scripts/eval_contacts.py: pipeline touches and rallies vs data/labels/<id>/events.csv.
  match_tolerance_s: 0.25    # a predicted touch this close to a labelled one is the same touch
  rally_margin_s: 1.0        # predictions this far outside a labelled rally aren't judged

train:
  # RF-DETR fine-tune (scripts/train_detector.py), on the local GPU (RTX 4070 SUPER,
  # 12 GB) or a rented one. Never on a CPU.
  model: medium              # nano | small | medium | base | large (Apache-2.0)
  # Must be a multiple of patch_size * num_windows: 32 for nano/small/medium/large,
  # 56 for base (use 1288). The ball is ~20 px at 4K: keep it high.
  resolution: 1280
  epochs: 60
  # "auto" picked 9 at 1280, which overflows 12 GB: Windows then spills into system RAM
  # and training runs ~10x slower. 4 x 4 keeps an effective batch of 16 on the GPU.
  batch_size: 4
  grad_accum_steps: 4
  # rfdetr's per-batch multi-scale resizes every batch to its LARGEST scale (above
  # 1280 with expanded scales), which overflows 12 GB the same way. Tiles are already
  # about the input size, so train at the fixed resolution.
  multi_scale: "off"         # "off" | per-batch | per-sample (quoted: YAML reads off as false)
  lr: 0.0001
  early_stopping: true
  num_workers: 2
  pretrained_dir: models/pretrained
  output_dir: models/rfdetr
  # Pre-labelling (scripts/prelabel.py): keep boxes above this score for correction.
  prelabel_threshold: 0.3

# Rough play activity (setter_eyes.rally.activity), used to sample labelling frames
# from live play and to skip the time between rallies in detection. Not rally segmentation.
activity:
  width: 480                 # frames are scored at this width
  step_s: 0.1                # one sample this often
  court_band: [0.35, 1.0]    # image rows scored (fractions): floor and players, not ceiling
  diff_threshold: 25
  smooth_samples: 10         # 1 s moving average
  # Labelling sample: bursts of consecutive frames, mostly from active play.
  bursts: 20
  burst_len: 10
  active_share: 0.8          # the rest come from downtime (still useful negatives)
  active_quantile: 0.6       # samples above this per-video quantile count as active
  # Play spans (scripts/find_play.py): ball detection runs only inside them. Generous on
  # purpose: a missed serve costs far more than detecting some downtime. Check with
  # find_play.py's report against labelled rallies before tightening.
  play:
    # Active where the smoothed activity is above low + level x (high - low), with low
    # and high this video's own quantiles (gyms, cameras and crowds differ).
    low_quantile: 0.2
    high_quantile: 0.95      # inside play as long as play is > 5% of the video
    level: 0.25
    pad_before_s: 5.0        # the serve comes before the court moves (receivers react ~1 s
                             # later; the server standing still behind the line scores low)
    pad_after_s: 3.0         # the last touch and the ball landing
    min_gap_s: 8.0           # quieter stretches shorter than this stay in (one long rally)
    min_span_s: 1.0          # less motion than this in a joined span is noise
    check_lead_s: 1.0        # find_play.py's check: labelled rallies covered from this long
                             # before their start (the toss) to their end

# Web app (scripts/serve_app.py): processing queue, review, stat sheet in the browser.
app:
  # Pipeline steps a processing job runs, in order (scripts/<step>.py --video KEY), as in
  # scripts/process_videos.ps1. find_rallies twice: check_blocks needs its point winners.
  steps: [find_play, detect_ball, detect_people, track_ball, track_people, find_rallies,
          check_blocks, find_rallies]
  # Steps from the first of these on need the court calibration: a job without one stops
  # there ("needs calibration") and is resumed once the video is calibrated.
  needs_calibration: [track_ball, track_people, find_rallies, check_blocks]
  clip_width: 1280         # px, rally clips for review
  clip_pad_s: 2.0          # clip margin around a rally
  log_dir: data/outputs/logs/jobs
